<!DOCTYPE html>
<html lang="yo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ÀRÒYÉ — Your Yoruba Voice AI</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    
    <!-- LEFT SIDEBAR (Desktop) -->
    <aside class="sidebar">
      <div class="brand-header">
        <div class="brand-logo">
          <img src="logo.svg" alt="ÀRÒYÉ Logo" class="logo-img">
        </div>
        <div class="brand-text">
          <h1 class="brand-name">ÀRÒYÉ</h1>
          <p class="brand-tagline">Your Yoruba Voice AI</p>
        </div>
      </div>

      <nav class="nav-menu">
        <button class="nav-item active" data-tab="chat">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span>Chat</span>
        </button>
        <button class="nav-item" data-tab="voice">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
          <span>Voice</span>
        </button>
        <button class="nav-item" data-tab="history">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span>History</span>
        </button>
        <button class="nav-item" data-tab="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="voice-badge-card">
          <div class="sound-wave-icon">
            <span class="bar bar-1"></span>
            <span class="bar bar-2"></span>
            <span class="bar bar-3"></span>
            <span class="bar bar-4"></span>
          </div>
          <div class="voice-badge-text">
            <strong>Speak Yoruba</strong>
            <span>Get real answers</span>
          </div>
        </div>
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span class="status-text">Online</span>
        </div>
      </div>
    </aside>

    <!-- MAIN CHAT CONTAINER -->
    <main class="main-content">
      
      <!-- Top Mobile / Desktop Header -->
      <header class="top-header">
        <div class="header-left">
          <div class="mobile-logo-wrap">
            <img src="logo.svg" alt="ÀRÒYÉ" class="mobile-logo">
          </div>
          <div>
            <h2 class="header-title">ÀRÒYÉ</h2>
            <p class="header-sub">Always here to help</p>
          </div>
        </div>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </header>

      <!-- Chat Stream Area -->
      <div class="chat-viewport" id="chatViewport">
        
        <!-- Welcome Hero (shown when no messages) -->
        <div class="hero-welcome" id="heroWelcome">
          <div class="hero-emblem">
            <img src="logo.svg" alt="ÀRÒYÉ" class="hero-logo-img">
          </div>
          <h2 class="hero-title">Báwo ni?</h2>
          <p class="hero-description">
            Mo wà níbí láti ràn ọ́ lọ́wọ́. Béèrè ohunkohun nípa àṣà, ìtàn, èdè Yorùbá àti bẹ́ẹ̀ bẹ́ẹ̀ lọ.
          </p>
        </div>

        <!-- Chat messages will be dynamically appended here -->
        <div class="messages-container" id="messagesContainer"></div>
      </div>

      <!-- Input Footer Section -->
      <footer class="chat-input-area">
        
        <!-- Quick Yoruba Diacritic Bar (Effortless Tone Marks) -->
        <div class="diacritic-toolbar">
          <span class="diacritic-label">Àmì:</span>
          <button type="button" class="accent-btn" data-char="ẹ">ẹ</button>
          <button type="button" class="accent-btn" data-char="ọ">ọ</button>
          <button type="button" class="accent-btn" data-char="ṣ">ṣ</button>
          <button type="button" class="accent-btn" data-char="á">á</button>
          <button type="button" class="accent-btn" data-char="à">à</button>
          <button type="button" class="accent-btn" data-char="é">é</button>
          <button type="button" class="accent-btn" data-char="è">è</button>
          <button type="button" class="accent-btn" data-char="ó">ó</button>
          <button type="button" class="accent-btn" data-char="ò">ò</button>
          <button type="button" class="accent-btn" data-char="ń">ń</button>
        </div>

        <!-- Main Input Capsule -->
        <form class="input-capsule" id="chatForm">
          <button type="button" class="mic-btn" id="micBtn" title="Speak Yoruba (Voice Input)">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
            </svg>
          </button>
          
          <input 
            type="text" 
            id="userInput" 
            class="text-input" 
            placeholder="Bẹ̀rẹ̀ sí í kọ tàbí sọ̀rọ̀..." 
            autocomplete="off"
            required
          />

          <button type="submit" class="send-btn" id="sendBtn" title="Send">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </form>
      </footer>

      <!-- MOBILE BOTTOM DOCK (Visible on phone screens) -->
      <nav class="mobile-dock">
        <button class="dock-item active" data-tab="chat">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span>Chat</span>
        </button>
        <button class="dock-item" data-tab="voice">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
          <span>Voice</span>
        </button>
        <button class="dock-item" data-tab="history">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span>History</span>
        </button>
        <button class="dock-item" data-tab="settings">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>Settings</span>
        </button>
      </nav>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
